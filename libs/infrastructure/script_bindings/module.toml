[module]
name = "script_bindings"
layer = "infrastructure"
version = "0.1.0"
description = "Liaisons du langage script vers ecs::, ui:: et generators::"
type = "static"              # executable | static | shared | header-only

[sources]
dirs = ["src"]

[include]
public = ["include"]      # propagé aux modules dépendants
private = ["src"]

[dependencies]
modules = ["script", "ecs", "ui", "generators"]
pkg_config = []
system = []

[flags]
defines = []
public_defines = []
cflags = []
cxxflags = []

[tests]
dirs = ["tests"]
