[module]
name = "archive"
layer = "infrastructure"
version = "0.1.0"
type = "static"              # executable | static | shared | header-only

[sources]
dirs = ["src"]
# exclude = ["src/experimental/**"]

[include]
public = ["include"]      # propagé aux modules dépendants
# private = ["src"]

[dependencies]
modules = ["core", "sdl3"]
pkg_config = []           # ex. ["zlib", "libcurl"]
system = []               # ex. ["m", "pthread"]

[flags]
defines = []
public_defines = []
cflags = []
cxxflags = []

[tests]
dirs = ["tests"]

